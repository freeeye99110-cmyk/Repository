<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة أسعار هيكفيجن</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 600px; background: white; padding: 20px; margin: auto; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #d32f2f; }
        .btn { display: inline-block; background: #d32f2f; color: white; padding: 10px 20px; margin: 10px; border-radius: 5px; text-decoration: none; font-weight: bold; }
        .price-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .price-table th, .price-table td { border: 1px solid #ddd; padding: 10px; text-align: right; }
        .price-table th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>تطبيق قائمة الأسعار الذكي</h1>
        <p>مرحباً بك في تطبيق استعراض الأسعار الخاص بنا.</p>
        <table class="price-table">
            <thead>
                <tr>
                    <th>المادة / الموديل</th>
                    <th>السعر</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>كاميرا هيكفيجن داخلية 2 ميجا</td>
                    <td>جاري التحديث...</td>
                </tr>
                <tr>
                    <td>جهاز تسجيل 4 قنوات HD</td>
                    <td>جاري التحديث...</td>
                </tr>
            </tbody>
        </table>
        <br>
        <p style="color: #666; font-size: 14px;">(ملاحظة: يمكنك تعديل هذه الأسعار وتحديثها في أي وقت لاحقاً)</p>
    </div>
</body>
</html>
